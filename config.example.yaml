# 零配置：宿主只需启用插件，不必引用本文件。
# 首次启动自动完成：
#   - data_dir/key-peppers（pepper）
#   - caller=default（仅作为 Key 归属与用量归类，不设置账户额度）
#   - 价格规则 bootstrap-all-models：regexp ".*"，费用 0
#   - 不自动创建 API Key；请通过侧栏或管理 API 手动签发，并为每个 Key 设置额度
#
# 需要覆盖默认时，在宿主 plugins.items.credit-manager.config 写：
#   config_file: /绝对路径/config.example.yaml
# 或设环境变量 CREDIT_MANAGER_CONFIG_FILE。宿主内联字段会覆盖文件；嵌套 config_file 会被忽略。

# data_dir: ./data/credit-manager
# database_file: credit-manager.db
# busy_timeout: 5s

keys:
  pepper_env: CREDIT_MANAGER_KEY_PEPPERS
  pepper_file: key-peppers
  active_pepper_id: active

limits:
  max_token_estimate: 1000000
  default_output_reserve: 4096
  require_estimate: false

pricing:
  # 零配置默认 allow；生产可改 deny 并配置真实价格规则
  unknown_policy: allow

settlement:
  missing_usage: settle_reserved

stream:
  max_buffer_bytes: 4194304
  stale_reservation_timeout: 2h

# 保留轻量鉴权/调度模式；true 不注册插件模型路由与执行器，false 保留旧执行模式。
# 切换模式需重新加载插件注册能力。无论哪种模式，调度均按权限→可用性→最高 priority 选择，
# 不依赖下方 api_fallback 或旧执行期重放开关。绑定 Key 允许自己的 OAuth + 全局 API；无绑定为全局候选。
auth_only: false

# 插件会话黏性（默认关闭，保持按请求轮询）。
# 开启后，同一会话在 TTL 内复用权限/可用性过滤后的最高优先级池中的账号；
# 黏性不会越过 Key 权限，也不会把会话固定在低于当前可用最高 priority 的账号上。
# 会话标识取自请求头，优先级与宿主 routing.session-affinity 一致：
#   X-Claude-Code-Session-Id > Session-Id / Session_id > X-Session-ID > X-Session-Affinity > X-Client-Request-Id
# 缺少会话标识时按同级轮询；账号不可用（并发上限、warmup 占用、被移出候选）时重新选择并绑定。
# 插件处理账号选择时宿主的会话黏性不参与，因此需要亲和时请在插件这里开启。
session_affinity:
  enabled: false
  ttl: 1h

# 仅 auth_only=false 的旧 API 执行期重放：OAuth 失败（429、408、5xx、限流、流内 overload /
# usage_limit / 加密推理校验失败等）且还没有向客户端输出正文时，插件用同一请求改发到这里。
# 是否重放由控制台的旧执行期开关（auth-quotas/fallback）决定；auth_only=true 时该功能不启用。
# 以下开关、名单与模型均不限制正常调度；API 的正常选择只由权限、可用性和 priority 决定。
# 下面保留旧的单家默认配置；provider 或 model 留空即关闭执行期兜底。
# model 替换客户端请求的模型名；宿主必须能把这个名字路由到目标供应商。
api_fallback:
  provider: openai-compatible-deepseek
  model: deepseek-flash
  # 多家兜底（可选）：取消下方注释，并将上方 model 改成 credit-fallback。
  # 每家宿主 openai-compatibility.models 都应为其上游模型配置同名 alias: credit-fallback。
  # 非空 providers 覆盖旧 provider；仅允许 openai-compatible-<name>，忽略大小写和首尾空白，
  # 不可重复、不可有空项，且 model 必须非空。providers 为空则保留旧单家行为。
  # providers:
  #   - openai-compatible-magpie
  #   - openai-compatible-deepseek
  #
  # 此名单仅控制 auth_only=false 的执行期重放；正常调度跨优先级接收可用候选，
  # 按权限→可用性→最高 priority→同级轮询/会话黏性选择，不读取此名单或旧重放开关。
  # 执行期从 host.auth.list 快照按 priority 高者先，同级提供商按请求轮换，
  # 每家强制重放一次；家内仍由宿主重试和冷却。不是按列表顺序，
  # 也不等同宿主原生的跨提供商/凭据混合调度。
  # 不存在/被禁用的提供商会跳过；冷却可用性仍由宿主决定；无可用提供商就停止。
  # 已输出正文、遇到不可重试错误或遍历完白名单后停止，不会无限重试。
  # 原请求本身为 API 时，仅其提供商也在此白名单内才允许 API→API 切换。
  # auth.list 读取失败时保留原始失败，不回退旧 provider；未绑定 Key 的路由不变。
  # 需关闭 CPA Home 路由；Home 模式绕过强制提供商，不支持上述白名单保证。
